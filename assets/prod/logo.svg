  <!-- Text monogram centered -->
  <text x="50%" y="69" dominant-baseline="middle" text-anchor="middle" font-family="Google Sans, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">I</tspan>
    <tspan fill="url(#grad)">2</tspan>
    <tspan fill="#FFFFFF">P</tspan>
